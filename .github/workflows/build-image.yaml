on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      name:
        required: true
        type: string
      tag:
        required: true
        type: string
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: .
      target:
        type: string
        default: ''
      build_args:
        type: string
        default: ''
      use_submodule_ssh:
        required: false
        type: boolean
        default: false
    secrets:
      SUBMODULE_SSH_KEY:
        required: false
    outputs:
      digest:
        description: Digest (sha256:…) of the pushed image index, as reported by docker/build-push-action
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    env:
      REGISTRY_HOST: ${{ vars.REGION }}-docker.pkg.dev
      IMAGE_NAME: ${{ vars.REGISTRY_URL }}/${{ inputs.name }}
      IMAGE_TAG: ${{ inputs.tag }}
      CACHE_REF: ${{ vars.CACHE_REGISTRY_URL || format('{0}/cache', vars.REGISTRY_URL) }}/${{ inputs.name }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup submodules
      if: ${{ inputs.use_submodule_ssh }}
      env:
        SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
      run: |
        set -euo pipefail

        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

        git submodule update --init --recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # GCP credentials are short-lived (5 minutes) and a cold build can take
    # longer, so the build runs twice: authenticate, import the layer cache and
    # build without pushing; then authenticate again and let a second, fully
    # cached pass push the image and export the cache with fresh credentials.
    # The cache lives in the registry because GitHub Actions caches are scoped
    # to a git ref, and every release tag is a new ref.
    #
    # No credentials file is written: it would land in GITHUB_WORKSPACE, i.e.
    # inside the Docker build context. Direct Workload Identity Federation
    # (no service account) cannot mint an access_token, so the masked federated
    # token from the auth_token output is used for the registry login instead.
    - id: auth
      name: Authenticate with GCP
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        project_id: '${{ vars.PROJECT_ID }}'
        workload_identity_provider: '${{ vars.WORKLOAD_IDENTITY_PROVIDER }}'
        create_credentials_file: false

    - name: Log in to the registry
      env:
        TOKEN: ${{ steps.auth.outputs.auth_token }}
      run: |
        printf '%s' "$TOKEN" \
          | docker login -u oauth2accesstoken --password-stdin "$REGISTRY_HOST"

    - name: Build image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        build-args: ${{ inputs.build_args }}
        push: false
        provenance: false
        cache-from: type=registry,ref=${{ env.CACHE_REF }}

    - id: auth_push
      name: Authenticate with GCP again
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        project_id: '${{ vars.PROJECT_ID }}'
        workload_identity_provider: '${{ vars.WORKLOAD_IDENTITY_PROVIDER }}'
        create_credentials_file: false

    - name: Log in to the registry again
      env:
        TOKEN: ${{ steps.auth_push.outputs.auth_token }}
      run: |
        printf '%s' "$TOKEN" \
          | docker login -u oauth2accesstoken --password-stdin "$REGISTRY_HOST"

    # Provenance uses mode=min: build_args is caller-supplied and mode=max
    # would publish build-arg values in the attestation.
    - id: push
      name: Push image and layer cache
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        build-args: ${{ inputs.build_args }}
        push: true
        provenance: mode=min
        sbom: true
        # Only the release tag is pushed: tags are immutable, so a moving "latest" tag cannot be updated.
        tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        cache-from: type=registry,ref=${{ env.CACHE_REF }}
        cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=max,image-manifest=true,oci-mediatypes=true

    - name: Record image digest
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        set -euo pipefail
        echo "Pushed $IMAGE_NAME:$IMAGE_TAG@$DIGEST"
        {
          echo "### Image"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Image | \`$IMAGE_NAME\` |"
          echo "| Tag | \`$IMAGE_TAG\` |"
          echo "| Digest | \`$DIGEST\` |"
        } >> "$GITHUB_STEP_SUMMARY"
